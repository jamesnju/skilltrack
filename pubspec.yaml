
name: skill_track
description: "Offline-first personal technology learning and productivity tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Charts and progress tracking
  fl_chart: ^0.69.0

  # Local notifications and reminders
  flutter_local_notifications: ^17.2.2

  # Date and time formatting
  intl: ^0.20.3

  # UI components
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
